table_name: 'Hires by Country over Years '
main_dttm_col: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
sql: "SELECT \n    CASE \n        WHEN LOWER(l.country) LIKE '%united%' OR LOWER(l.country)\
  \ LIKE '%usa%' OR LOWER(l.country) LIKE '%u.s.%' \n        THEN 'United States'\
  \ \n        ELSE l.country \n    END AS country_group,\n    d.year, \n    COUNT(*)\
  \ AS total_hires\nFROM fact_application f\nJOIN dim_location l ON f.location_sk\
  \ = l.location_sk\nJOIN dim_date d ON f.date_sk = d.date_sk\nWHERE f.is_hired =\
  \ 1 \n  AND (\n      LOWER(l.country) LIKE '%united%' \n      OR LOWER(l.country)\
  \ LIKE '%usa%'\n      OR LOWER(l.country) LIKE '%u.s.%'\n      OR LOWER(l.country)\
  \ IN ('brazil', 'colombia', 'ecuador')\n  )\nGROUP BY country_group, d.year\nORDER\
  \ BY country_group, d.year;"
