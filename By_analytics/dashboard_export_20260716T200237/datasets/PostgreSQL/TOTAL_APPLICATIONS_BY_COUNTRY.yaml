table_name: TOTAL APPLICATIONS BY COUNTRY
main_dttm_col: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
sql: "SELECT \n    CASE \n        WHEN LOWER(l.country) LIKE '%united%' OR LOWER(l.country)\
  \ LIKE '%usa%' OR LOWER(l.country) LIKE '%u.s.%' \n        THEN 'United States'\
  \ \n        ELSE l.country \n    END AS country_group,\n    COUNT(f.application_sk)\
  \ AS total_applications\nFROM fact_application f\nJOIN dim_location l ON f.location_sk\
  \ = l.location_sk\nGROUP BY country_group\nORDER BY total_applications DESC;"
