sql: "SELECT \n    d.year, \n    SUM(f.is_hired) AS total_hires\nFROM fact_application\
  \ f\nJOIN dim_date d ON f.date_sk = d.date_sk\nWHERE f.is_hired = 1\nGROUP BY d.year\n\
  ORDER BY d.year;\n"
