x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  - ./docker:/app/docker
  - ./docker/superset_config.py:/app/pythonpath/superset_config.py

services:
  db:  
    image: postgres:15
    container_name: recruitment_dw
    hostname: db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "password_encryption=md5"]

  superset:
    env_file:
      - path: docker/.env
        required: true
    image: apache/superset:3.0.0-py310
    container_name: superset_app
    command:
      - sh
      - -c
      - "chmod +x /app/docker/*.sh && /app/docker/docker-bootstrap.sh app"
    restart: unless-stopped
    ports:
      - "8088:8088"
    user: *superset-user
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
      DATABASE_DB : "${POSTGRES_DB}"

  superset-init:
    image: apache/superset:3.0.0-py310
    container_name: superset_init
    command:
      - sh
      - -c
      - "chmod +x /app/docker/*.sh && /app/docker/docker-init.sh"
    env_file:
      - path: docker/.env
        required: true
    depends_on:
      db:   
        condition: service_started
      redis:
        condition: service_started
    user: *superset-user
    volumes: 
      - ./docker:/app/docker
      - ./docker/superset_config.py:/app/pythonpath/superset_config.py
    environment:
      SUPERSET_LOAD_EXAMPLES: "${SUPERSET_LOAD_EXAMPLES:-no}"
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
      DATABASE_DB : "${POSTGRES_DB}"
    healthcheck:
      disable: true

  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
  redis: